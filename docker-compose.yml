services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nexuscampus-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nexus-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexuscampus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://nexus:campus_secret@db:5432/nexuscampus
      - REDIS_URL=redis://redis:6379/0
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
      - ML_MODEL_CONTAMINATION=0.08
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - nexus-net

  db:
    image: postgres:16-alpine
    container_name: nexuscampus-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=nexus
      - POSTGRES_PASSWORD=campus_secret
      - POSTGRES_DB=nexuscampus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexuscampus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nexus-net

  mqtt:
    image: eclipse-mosquitto:2
    container_name: nexuscampus-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - nexus-net

  redis:
    image: redis:7-alpine
    container_name: nexuscampus-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nexus-net

volumes:
  pgdata:
  redisdata:

networks:
  nexus-net:
    driver: bridge
